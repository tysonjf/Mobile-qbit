name: CI

# Checks every pull request (and every push to master):
#  - lint: the linters, the formatting and the unit tests of the WebUI, the
#    checks of "Checks before a PR" in dev/README.md
#  - tours: the screenshot tours of dev/ against a real qbittorrent-nox, as in
#    dev/README.md. tour.js fails on page errors, failed steps and sideways
#    scrolling; the screenshots are uploaded as the "screenshots" artifact.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linters and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the tools
        # no lockfile in the repository, see .gitignore
        run: pnpm install --no-frozen-lockfile --shamefully-hoist

      - name: ESLint
        run: pnpm exec eslint *.mjs private/*.html private/scripts/*.js private/views/*.html public/*.html public/scripts/*.js test/*/*.js dev/*.js

      - name: Stylelint
        run: pnpm exec stylelint "**/*.css"

      - name: html-validate
        run: pnpm exec html-validate private public

      - name: Formatting
        run: |
          pnpm exec prettier --check "**/*.css"
          pnpm exec js-beautify -r *.mjs private/*.html private/scripts/*.js private/views/*.html public/*.html public/scripts/*.js test/*/*.js
          git diff --exit-code || { echo "Run pnpm run format (js-beautify) and commit the result"; exit 1; }

      - name: Unit tests
        run: pnpm exec vitest run --dom

  tours:
    name: Screenshot tours
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dev
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Cache qbittorrent-nox
        uses: actions/cache@v4
        with:
          path: dev/.cache/qbittorrent-nox-*
          key: qbittorrent-nox-${{ hashFiles('dev/start-qbittorrent.sh') }}

      - name: Start qbittorrent-nox and its peer
        run: |
          nohup sh start-qbittorrent.sh > .cache/qbittorrent.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8080/api/v2/app/version && break; sleep 1; done
          QBT_PROFILE=peer QBT_PORT=8081 QBT_BT_PORT=56882 nohup sh start-qbittorrent.sh > .cache/peer.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:8081/api/v2/app/version && break; sleep 1; done
          echo

      - name: Make the test data
        id: setup
        run: python3 make-test-data.py

      - name: Tours at phone sizes
        run: |
          status=0
          for file in scenarios/*.json; do
            case "$file" in
              */update.json | */tablet.json) continue ;;
            esac
            node tour.js "$file" 390x844,844x390 || status=1
          done
          exit $status

      # the following steps also run when an earlier tour step failed
      - name: Tours at tablet sizes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && hashFiles('dev/scenarios/tablet.json') != '' }}
        run: |
          node tour.js scenarios/tablet.json 768x1024
          TOUCH=1 node tour.js scenarios/tablet.json 1024x768

      - name: Updater
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          nohup python3 fake-github.py > .cache/fake-github.log 2>&1 &
          # it builds the fake releases before it listens
          for i in $(seq 180); do curl -s -o /dev/null http://127.0.0.1:8098/ && break; sleep 1; done
          node tour.js scenarios/update.json 390x844

      - name: Upload the screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            dev/.cache/shots
            dev/.cache/*.log
          retention-days: 14
