name: Release

# Publishes a GitHub release when a version tag (v1.2.3) is pushed. It contains
# the WebUI as a ZIP file and as the .torrent the updater in the WebUI uses
# (Help → Check for WebUI updates). See tools/make-release.py and the
# "Making a release" section of dev/README.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the release files
        run: python3 tools/make-release.py "$GITHUB_REF_NAME" --out dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Mobile-qbit $GITHUB_REF_NAME" $prerelease
